# Repasse para o container. Usar com: set $upstream http://<alias>:<porta>; proxy_pass $upstream;
# (sem caminho depois da porta: a URI segue intacta, o que as URLs assinadas do S3 exigem)
proxy_http_version 1.1;

# Host original: a aplicação (e a assinatura do S3) enxerga o hostname público
proxy_set_header Host              $host;
# IP real do visitante (já restaurado pelo realip) e o esquema que ele usou
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# WebSocket
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# httpoxy: nunca repassar o cabeçalho "Proxy"
proxy_set_header Proxy             "";

# Timeouts padrão ficam no nginx.conf: aqui não, para o site poder sobrescrever
# (a mesma diretiva duas vezes no mesmo bloco é erro)

# Não anunciar a tecnologia de trás
proxy_hide_header X-Powered-By;
# HSTS é decidido só aqui na borda (snippets/hsts.conf). O storage e o ASP.NET mandam
# o deles (1 ano, includeSubDomains) e o navegador guardaria isso sem a gente escolher
proxy_hide_header Strict-Transport-Security;
