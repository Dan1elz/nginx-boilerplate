# Comum a todo site (dentro do server 443). Mudou aqui, vale para todos.

include /etc/nginx/snippets/ssl.conf;
include /etc/nginx/snippets/security-headers.conf;
# include /etc/nginx/snippets/hsts.conf;

# Só aceita conexões vindas da Cloudflare: ninguém contorna o proxy (e o WAF dela)
# acessando o IP da VM direto. Lista em snippets/cloudflare-geo.conf
# (scripts/update-cloudflare-ips.sh). Para depurar sem a Cloudflare, comente a linha.
if ($from_cloudflare = 0) { return 444; }

# Conexões simultâneas por visitante
limit_conn conn_per_ip 100;
