# HSTS: o navegador passa a recusar http para o domínio pelo tempo do max-age.
# Não tem "desfazer" rápido. Comece com 300 (5 min), confira tudo em https e só então
# suba para 31536000 (1 ano). Não ligue também na Cloudflare (header duplicado).
# Ativar: descomentar o include em snippets/site.conf.
add_header Strict-Transport-Security "max-age=300" always;
