# Página amigável quando o NGINX não consegue falar com o container (parado, alias errado...).
# Erros que a própria aplicação devolve passam intactos (proxy_intercept_errors fica off).
error_page 502 503 504 /_errors/50x.html;
error_page 429 /_errors/429.html;

location ^~ /_errors/ {
    internal;
    alias /usr/share/nginx/errors/;
}
