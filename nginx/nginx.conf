# Config global. Cada site mora em sites/<hostname>.conf; pedaços repetidos em snippets/.
user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Hostnames longos (ex.: projeto-api-dev.example.com) estouram o padrão de 64
    server_names_hash_bucket_size 128;

    # Padrão do nginx é 1 MB. Sites com upload maior sobrescrevem no próprio arquivo
    client_max_body_size 10m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;

    # Timeouts do proxy (o site sobrescreve no location: WebSocket, download grande...)
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # A Cloudflare já comprime para o navegador; aqui vale para o trecho Cloudflare → VM
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml image/svg+xml;

    # $remote_addr já é o IP real do visitante (realip abaixo); cf_ray ajuda a cruzar com o painel da Cloudflare
    log_format main '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                    'up=$upstream_addr ua="$http_user_agent" cf_ray=$http_cf_ray';
    access_log /dev/stdout main;

    # WebSocket (HMR do Vite, etc.): só manda "Connection: upgrade" quando o cliente pediu Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limit por IP real. "per_ip" para APIs em geral, "login" para rotas de autenticação.
    # Estourou: 429 (o burst de cada location absorve picos legítimos)
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    # Bloqueio por rate limit é esperado, não erro do servidor
    limit_req_log_level warn;
    limit_conn_log_level warn;

    include /etc/nginx/snippets/resolver.conf;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # 1 = conexão veio da Cloudflare (ou de dentro do próprio container, para testes).
    # Usa o IP da CONEXÃO ($realip_remote_addr), não o do visitante. Ver snippets/site.conf
    geo $realip_remote_addr $from_cloudflare {
        default 0;
        127.0.0.0/8 1;
        include /etc/nginx/snippets/cloudflare-geo.conf;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites/*.conf;
}
