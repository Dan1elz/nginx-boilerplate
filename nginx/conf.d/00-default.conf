# Porta 80 de todos os hostnames, e a 443 de qualquer hostname sem arquivo em sites/.

server {
    listen 80 default_server;
    server_name _;

    # Healthcheck do container (compose.yaml)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTTP → HTTPS para qualquer hostname (cada site só precisa do bloco 443).
    # Hostname sem arquivo em sites/ é redirecionado e depois recusado na 443.
    # Quem não veio da Cloudflare (varredura no IP da VM) leva 444: conexão fechada.
    location / {
        if ($from_cloudflare = 0) { return 444; }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    # Nem entrega certificado para hostname desconhecido (a Cloudflare mostra 525)
    ssl_reject_handshake on;
}
